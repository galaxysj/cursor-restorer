<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Cursor Restorer</title>
  <desc id="desc">A single dark macOS cursor with a restrained motion mark on a clean white rounded-square background.</desc>

  <rect x="72" y="72" width="880" height="880" rx="210" fill="#F7F7F8"/>

  <!-- One restrained motion mark. -->
  <path d="M708 326 H804" stroke="#777A82" stroke-width="26" stroke-linecap="round"/>
  <path d="M730 398 L802 428" stroke="#A2A4AA" stroke-width="22" stroke-linecap="round"/>

  <!-- One clear macOS-style pointer. -->
  <path d="M300 232 L692 578 L553 598 L631 832 L508 876 L427 636 L316 752 Z"
        transform="translate(16 -42)"
        fill="#202126" stroke="#050506" stroke-width="30" stroke-linejoin="round"/>
</svg>
